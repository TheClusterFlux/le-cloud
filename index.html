<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le-Cloud Weather App</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Le-Cloud Weather</h1>
        </header>
        
        <div class="search-container">
            <input type="text" id="location-input" placeholder="Enter a city name...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <button id="geolocation-btn" title="Use my location"><i class="fas fa-map-marker-alt"></i></button>
        </div>
        
        <div class="weather-container">
            <div class="current-weather">
                <div class="weather-info">
                    <h2 id="location">Loading...</h2>
                    <p id="date-time"></p>
                    <div class="temp-container">
                        <span id="temperature">--</span>
                        <span class="unit">°C</span>
                    </div>
                    <p id="weather-description">--</p>
                </div>
                <div class="weather-icon">
                    <img id="weather-img" src="" alt="Weather icon">
                </div>
            </div>
            
            <div class="weather-details">
                <div class="detail">
                    <i class="fas fa-temperature-low"></i>
                    <div>
                        <span>Feels Like</span>
                        <p id="feels-like">--</p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-tint"></i>
                    <div>
                        <span>Humidity</span>
                        <p id="humidity">--</p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-wind"></i>
                    <div>
                        <span>Wind Speed</span>
                        <p id="wind-speed">--</p>
                    </div>
                </div>
                <div class="detail">
                    <i class="fas fa-cloud"></i>
                    <div>
                        <span>Cloudiness</span>
                        <p id="cloudiness">--</p>
                    </div>
                </div>
            </div>
            
            <div class="forecast-container">
                <h3>5-Day Forecast</h3>
                <div class="forecast-items" id="forecast">
                    <!-- Forecast items will be added here dynamically -->
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 Le-Cloud Weather | Data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
        </footer>
    </div>
    
    <script src="scripts/main.js"></script>
    <script src="scripts/theme.js"></script>
</body>
</html>
